[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartoon-rag"
version = "0.1.0"
description = "Grounded search over a fictional cartoon catalog"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
search = ["fastembed==0.9.0", "huggingface-hub>=0.24,<2"]

[project.scripts]
cartoon-rag = "cartoon_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
